# Gran Turismo 7: pedal power (relative to your FTP) is the throttle, the paddles steer,
# the shifters change gear. Set your FTP in the web UI header (or --ftp).
#
#   right paddle, outer swing -> steer right        left paddle, outer swing -> steer left
#   either paddle, inner swing -> analog brake
#   either upper shifter (SHIFT_UP_L/R) -> shift up (cross)
#   either lower shifter (SHIFT_DN_L/R) -> shift down (square)   (shift with either hand while steering)
#   B -> look back (L1)                             Y -> change view (R1)
#   POWERUP_L -> R3 (nitrous / overtake / DRS)      POWERUP_R -> options
#   Z -> circle (menu back)
#   tap ONOFF_R -> triangle, hold ONOFF_R -> touchpad
#
# Paddle signs (measured): right paddle outer = +, inner = -; left paddle outer = -, inner = +.
# Button roles follow GT7's default controller layout; if you remap in GT7, change them here.
name: GT7
extends: menu
description: Power as % of FTP -> throttle; paddles outer -> steer, inner -> brake; upper shifters -> shift up, lower shifters -> shift down (either side); B look back, Y change view.
axes:
  r2:
    # Proof of concept: throttle = power / FTP, so 100% FTP = 100% throttle.
    # Fine-tune with `in` (e.g. [0.15, 0.9] = no throttle while soft-pedalling,
    # full throttle a bit below FTP) or `curve: expo`. Gear-dependent tuning will
    # come with GT7 telemetry.
    source: power_ftp
    in: [0, 1]
    smooth_ms: 400         # the KICKR reports power ~1x per second; this turns the steps into ramps
  left_x:
    combine:
      - {source: paddle_r, min: 0, scale: 1}    # right paddle, outer swing (+) -> right
      - {source: paddle_l, max: 0, scale: 1}    # left paddle, outer swing (-) -> left
    in: [-1, 1]
    out: [-1, 1]
    deadzone: 0.06
    curve: expo
    gamma: 1.3
    smooth_ms: 40          # the paddle reports in coarse steps; soften them a little
  l2:
    mix: max               # brake = whichever input is pressed hardest (no adding up)
    combine:
      - {source: paddle_l, min: 0, scale: 1}    # left paddle, inner swing (+)
      - {source: paddle_r, max: 0, scale: -1}   # right paddle, inner swing (-)
buttons:
  cross: [A, SHIFT_UP_L, SHIFT_UP_R]     # shift up (and confirm in menus)
  square: [SHIFT_DN_L, SHIFT_DN_R]       # shift down
  l1: B                    # look back
  r1: Y                    # change view
  r3: POWERUP_L            # nitrous / overtake
  circle: Z                # back in menus
  options: POWERUP_R
  triangle: {tap: ONOFF_R, ms: 400}   # ONOFF_R's tap was options (menu profile); hold is still touchpad
