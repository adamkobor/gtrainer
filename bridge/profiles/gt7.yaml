name: GT7
extends: menu
description: Power vs the gear's target (GT7 telemetry) -> throttle; paddles outer
  -> steer, inner -> brake; upper shifters -> shift up, lower shifters -> shift down
  (either side); B look back, Y change view.
axes:
  r2:
    source: power_gear
    in:
    - 0
    - 1
    smooth_ms: 400
    # falling: follow the trainer immediately when you ease off (rising stays smoothed)
    release_ms: 0
    # braking (either paddle inward) cuts the throttle instantly
    zero_when:
    - source: paddle_l
      above: 0.15
    - source: paddle_r
      below: -0.15
  left_x:
    combine:
    - source: paddle_r
      min: 0
      scale: 1
    - source: paddle_l
      max: 0
      scale: 1
    in:
    - -1
    - 1
    out:
    - -1
    - 1
    deadzone: 0.1
    curve: linear
    gamma: 1.3
    smooth_ms: 40
  l2:
    mix: max
    combine:
    - source: paddle_l
      min: 0
      scale: 1
    - source: paddle_r
      max: 0
      scale: -1
buttons:
  cross:
  - A
  - SHIFT_UP_L
  - SHIFT_UP_R
  square:
  - SHIFT_DN_L
  - SHIFT_DN_R
  l1: B
  r1: Y
  r3: POWERUP_L
  circle: Z
  options: POWERUP_R
  triangle:
    tap: ONOFF_R
    ms: 400
